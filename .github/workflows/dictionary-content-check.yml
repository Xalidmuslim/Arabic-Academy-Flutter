name: Dictionary content validation only
on:
  push:
    branches: ["codex/bayna-dictionary-demo-apk-20261024"]
    paths:
      - "assets/data/**"
      - "tools/**"
      - ".github/workflows/dictionary-content-check.yml"
  workflow_dispatch:
jobs:
  validate-json:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Preview confirmed prose-vowel mistakes without source changes
        run: python3 tools/fix_dictionary_confirmed_prose_vowels_20261029.py
      - name: Validate Arabic dictionary without Flutter or Android
        run: |
          python3 -m unittest discover -s tools -p "test_*.py"
          python3 tools/validate_dictionary.py
      - name: Audit Arabic vocalization variants (read-only)
        run: |
          python3 tools/audit_dictionary_variants.py --max-groups 85 --json-out dictionary-variant-audit.json
      - name: Show all headword candidate groups for editorial triage
        run: |
          python3 - <<'PY'
          import json
          report = json.load(open('dictionary-variant-audit.json', encoding='utf-8'))
          print('AUDIT_COMPACT_BEGIN')
          for group in report['groups']:
              forms = ' / '.join(group['forms'])
              brief = ' / '.join((item['meanings'][0][:65] if item['meanings'] else '?') for item in group['details'])
              files = ','.join(p.split('/')[-1].replace('entries_', '')[:28] for p in group['source_files'][:4])
              print(f"V|{group['kind']}|{group['unvocalized']}|{forms}|{brief}|{files}")
          print('AUDIT_COMPACT_END')
          PY
      - name: Audit every source card before merge (read-only)
        run: |
          python3 tools/audit_dictionary_raw_cards.py --max-examples 45 --json-out dictionary-raw-card-audit.json
      - name: Deep editorial QA of all 8840 raw cards
        run: |
          python3 tools/audit_dictionary_deep_editorial.py --max-examples 120 --json-out dictionary-deep-editorial-audit.json
      - name: Audit full Arabic prose vocalization (read-only)
        run: |
          python3 tools/audit_dictionary_prose_diacritics.py --max-examples 75 --max-tokens 100 --json-out dictionary-prose-diacritics.json
      - name: Fetch original 7,209-entry snapshot for reconciliation
        run: git fetch --no-tags --depth=1 origin ea13cb3bd2d11d6d6a48efea9036012c53b15e1a
      - name: Reconcile historical headword count against stable card IDs
        run: |
          python3 tools/audit_dictionary_revision_history.py \
            --before ea13cb3bd2d11d6d6a48efea9036012c53b15e1a \
            --after HEAD --max-changes 26 \
            --json-out dictionary-revision-reconciliation.json
      - name: Archive full dictionary revision reconciliation
        uses: actions/upload-artifact@v4
        with:
          name: dictionary-revision-reconciliation
          path: dictionary-revision-reconciliation.json
          retention-days: 14
      - name: Archive complete Arabic prose vocalization report
        uses: actions/upload-artifact@v4
        with:
          name: dictionary-prose-diacritics
          path: dictionary-prose-diacritics.json
          retention-days: 14
      - name: Archive deep editorial QA report
        uses: actions/upload-artifact@v4
        with:
          name: dictionary-deep-editorial-audit
          path: dictionary-deep-editorial-audit.json
          retention-days: 14
      - name: Archive raw card QA report
        uses: actions/upload-artifact@v4
        with:
          name: dictionary-raw-card-audit
          path: dictionary-raw-card-audit.json
          retention-days: 14
      - name: Archive full duplicate-candidate report
        uses: actions/upload-artifact@v4
        with:
          name: dictionary-variant-audit
          path: dictionary-variant-audit.json
          retention-days: 14
