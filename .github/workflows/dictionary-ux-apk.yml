name: Bayna dictionary UX modernization APK
on:
  push:
    branches: [codex/bayna-dictionary-ux-overhaul-20261109]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'assets/data/ru_glosses.json'
      - 'pubspec.yaml'
      - '.github/workflows/dictionary-ux-apk.yml'
      - 'tooling/**'
  workflow_dispatch:
jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.35.7"
          cache: true
      - name: Create Android platform project
        run: flutter create --project-name bayna_dictionary --platforms android --org com.xalidmuslim .
      - name: Enable Android predictive back for generated platform
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          source = manifest.read_text()
          assert '<application' in source
          source = source.replace('<application', '<application android:enableOnBackInvokedCallback="true"', 1)
          manifest.write_text(source)
          PY
      - name: Install Flutter packages
        run: flutter pub get
      - name: Dictionary regression tests
        run: flutter test
      - name: Run full test suite and analyzer
        run: |
          flutter test
          flutter analyze
      - name: Render compact UI previews for QA
        run: flutter test --update-goldens --dart-define=CAPTURE_UX_GOLDENS=true test/dictionary_ux_visual_test.dart
      - uses: actions/upload-artifact@v4
        with:
          name: bayna-ux-screenshot-previews
          path: test/goldens/*.png
      - name: Audit exact Russian translation coverage
        run: python3 tooling/translation_coverage.py
      - uses: actions/upload-artifact@v4
        with:
          name: bayna-translation-coverage
          path: translation-coverage.json
      - name: Preserve installed dictionary and its bookmarks
        run: |
          set -euo pipefail
          f=android/app/build.gradle.kts
          test -f "$f"
          sed -i 's/applicationId = "com.xalidmuslim.bayna_dictionary"/applicationId = "com.xalidmuslim.bayna_dictionary.uxpreview"/' "$f"
          grep -F 'applicationId = "com.xalidmuslim.bayna_dictionary.uxpreview"' "$f"
      - name: Build Android ARM64 APK
        run: flutter build apk --release --target-platform android-arm64
      - name: Verify APK
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          sha256sum build/app/outputs/flutter-apk/app-release.apk
          file build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: bayna-dictionary-ux-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Publish direct download
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          cp build/app/outputs/flutter-apk/app-release.apk /tmp/bayna-dictionary-ux.apk
          TAG=bayna-dictionary-ux-20261109
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            gh release upload "$TAG" /tmp/bayna-dictionary-ux.apk --clobber --repo "$GITHUB_REPOSITORY"
          else
            gh release create "$TAG" /tmp/bayna-dictionary-ux.apk \
              --repo "$GITHUB_REPOSITORY" --target "$GITHUB_SHA" --prerelease \
              --title "Bayna Dictionary UX preview (partial Russian glossary)" \
              --notes "Modernized Flutter UX preview. Review complete translation coverage before release. Separate app ID; diagnostic modes preserved."
          fi
