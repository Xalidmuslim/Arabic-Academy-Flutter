name: Bayna v38 ECC Flutter quality audit
on:
  push:
    branches: [codex/bayna-v38-ecc-flutter-audit-2026-10-22]
  pull_request:
    branches: [codex/bayna-v37-scroll-jank-icon-cleanup-2026-10-22]
permissions:
  contents: read
concurrency:
  group: bayna-ecc-audit-${{ github.ref }}
  cancel-in-progress: true
jobs:
  flutter-quality:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with: {flutter-version: '3.35.7', channel: stable, cache: true}
      - name: Verify source and protected performance contracts
        run: |
          python3 scripts/verify_performance_contract.py
          python3 scripts/verify_assets.py
          python3 scripts/verify_native_config.py
          python3 -m unittest discover -s scripts/tests -v
      - name: Use locked Flutter dependencies
        run: |
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock
      - name: Analyze Dart
        run: flutter analyze --no-pub
      - name: Test Flutter scroll, navigation, gestures, visual invariants and state
        run: |
          flutter test --no-pub --concurrency=2 --timeout=120s \
            test/background_artwork_preloader_test.dart \
            test/neumorphic_dashboard_test.dart \
            test/navigation_back_test.dart \
            test/app_shell_performance_test.dart \
            test/scroll_isolation_test.dart \
            test/medicine_smooth_motion_test.dart \
            test/matte_depth_test.dart \
            test/lesson_scroll_virtualization_test.dart \
            test/lesson_flow_test.dart \
            test/pdf_page_cache_test.dart \
            test/pdf_zoom_test.dart \
            test/book1_part2_test.dart
