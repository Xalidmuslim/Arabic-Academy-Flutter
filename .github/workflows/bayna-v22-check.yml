name: Bayna v22 semantic 3D artwork checks
on:
  push:
    branches: [codex/bayna-v22-auto-dialogue-ocr-flow]
  pull_request:
    branches: [codex/bayna-v21-offline-arabic-scanned-pdf-ocr]
permissions:
  contents: read
concurrency:
  group: bayna-v22-check-${{ github.ref }}
  cancel-in-progress: true
jobs:
  flutter-checks:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with: {flutter-version: '3.35.7', channel: stable, cache: true}
      - name: Locked dependencies and static analysis
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze --no-pub
      - name: Validate standalone artwork metadata
        run: |
          python3 scripts/verify_assets.py
          python3 scripts/verify_standalone_study_art.py
      - name: UI and gesture regression tests
        run: |
          flutter test --no-pub --reporter expanded --timeout 60s test/original_dialogue_test.dart test/book1_dialogues_test.dart test/lesson_flow_test.dart test/dialogue_art_assignment_test.dart test/lesson_art_integrity_test.dart test/matte_depth_test.dart test/floating_navigation_test.dart test/navigation_back_test.dart test/progress_review_back_test.dart test/private_textbook_test.dart test/pdf_zoom_test.dart test/arabic_voice_test.dart test/settings_compact_test.dart test/book1_part2_test.dart test/demo_school_test.dart test/demo_school_widgets_test.dart test/vocabulary_practice_test.dart test/practice_center_test.dart test/learning_expansion_test.dart test/student_diagnostics_test.dart test/learning_completion_test.dart test/startup_catalog_test.dart test/demo_showcase_and_word_cards_test.dart test/demo_showcase_widgets_test.dart test/teacher_workspace_navigation_test.dart test/learning_ux_reorganization_test.dart
