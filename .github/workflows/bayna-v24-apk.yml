name: Bayna v24 original PDF dialogue crops Android APK
on:
  push:
    branches:
      - codex/bayna-v24-yellow-dialogue-blue-orange-ocr
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bayna-v24-build-${{ github.ref }}
  cancel-in-progress: true
jobs:
  build-android:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env:
      GRADLE_OPTS: -Dorg.gradle.project.kotlin.compiler.execution.strategy=in-process
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '17'
          cache: gradle
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with:
          flutter-version: '3.35.7'
          channel: stable
          cache: true
      - name: Prepare build environment
        run: |
          bash scripts/prepare_android_ci.sh
          bash scripts/prepare_arabic_ocr.sh
          bash scripts/prepare_signing.sh --mode development
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock
          python3 scripts/verify_assets.py
          python3 scripts/verify_standalone_study_art.py
      - name: Compile release APK
        run: flutter build apk --release --split-per-abi
      - name: Verify build
        run: |
          python3 scripts/verify_android_artifacts.py --mode development \
            --apksigner "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            --certificate-sha256 "$(cat build/signing/certificate.sha256)" \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
      - name: Publish Android ARM64 APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bayna-v24-original-pdf-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 14
      - name: Analyze and test
        run: |
          flutter analyze --no-pub
          flutter test --no-pub test/original_dialogue_test.dart test/private_textbook_test.dart test/pdf_zoom_test.dart test/book1_dialogues_test.dart test/lesson_flow_test.dart test/dialogue_art_assignment_test.dart test/lesson_art_integrity_test.dart
          flutter test --no-pub test/demo_showcase_and_word_cards_test.dart test/demo_showcase_widgets_test.dart test/teacher_workspace_navigation_test.dart test/learning_ux_reorganization_test.dart test/demo_school_test.dart test/student_diagnostics_test.dart
