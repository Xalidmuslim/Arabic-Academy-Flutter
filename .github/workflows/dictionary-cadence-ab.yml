name: Dictionary scroll cadence A-B verification
on:
  push:
    branches: [codex/bayna-dictionary-scroll-cadence-20261105]
    paths:
      - "lib/**"
      - "test/**"
      - ".github/workflows/dictionary-cadence-ab.yml"
  workflow_dispatch:
jobs:
  analyze-test-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 55
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.35.7"
          channel: stable
          cache: true
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter create --project-name bayna_dictionary --platforms android --org com.xalidmuslim .
      - name: Create independent Impeller test package
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, xml.etree.ElementTree as ET
          gradle = Path("android/app/build.gradle.kts")
          data, n = re.subn(r'applicationId\s*=\s*"[^"]+"',
                            'applicationId = "com.xalidmuslim.bayna_dictionary.cadenceimpeller"',
                            gradle.read_text(), count=1)
          assert n == 1
          gradle.write_text(data)
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          ns = "http://schemas.android.com/apk/res/android"
          ET.register_namespace("android", ns)
          tree = ET.parse(manifest)
          tree.getroot().find("application").set(f"{{{ns}}}label", "Байна · Impeller")
          tree.write(manifest, encoding="utf-8", xml_declaration=True)
          PY
      - name: Build independent Impeller ARM64 APK
        run: flutter build apk --release --target-platform android-arm64
      - name: Verify Impeller APK and package
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging build/app/outputs/flutter-apk/app-release.apk | grep -F "com.xalidmuslim.bayna_dictionary.cadenceimpeller"
      - uses: actions/upload-artifact@v4
        with:
          name: bayna-dictionary-cadence-impeller
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
      - name: Create independent Skia comparison package
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re, xml.etree.ElementTree as ET
          gradle = Path("android/app/build.gradle.kts")
          source, n = re.subn(r'applicationId\s*=\s*"[^"]+"',
                              'applicationId = "com.xalidmuslim.bayna_dictionary.cadenceskia"',
                              gradle.read_text(), count=1)
          assert n == 1
          gradle.write_text(source)
          manifest = Path("android/app/src/main/AndroidManifest.xml")
          ns = "http://schemas.android.com/apk/res/android"
          ET.register_namespace("android", ns)
          tree = ET.parse(manifest)
          app = tree.getroot().find("application")
          assert app is not None
          app.set(f"{{{ns}}}label", "Байна · Skia")
          meta = ET.SubElement(app, "meta-data")
          meta.set(f"{{{ns}}}name", "io.flutter.embedding.android.EnableImpeller")
          meta.set(f"{{{ns}}}value", "false")
          tree.write(manifest, encoding="utf-8", xml_declaration=True)
          PY
      - name: Build independent Skia ARM64 APK
        run: flutter build apk --release --target-platform android-arm64
      - name: Verify Skia APK and package
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging build/app/outputs/flutter-apk/app-release.apk | grep -F "com.xalidmuslim.bayna_dictionary.cadenceskia"
      - uses: actions/upload-artifact@v4
        with:
          name: bayna-dictionary-cadence-skia
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
