name: Bayna v54 Card Layout and Scroll Regression
on:
  push:
    branches: [codex/bayna-v54-card-layout-scroll-20261031]
permissions:
  contents: read
concurrency:
  group: bayna-v54-card-scroll-${{ github.sha }}
  cancel-in-progress: false
jobs:
  quality:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with: {flutter-version: '3.35.7', channel: stable, cache: true}
      - name: Prepare immutable static artwork masks
        run: |
          python3 -m pip install --disable-pip-version-check Pillow==11.3.0
          python3 -m unittest discover -s scripts/tests -p 'test_static_artwork_shadows.py' -v
          python3 -m unittest discover -s scripts/tests -p 'test_cached_card_shadows.py' -v
          python3 scripts/generate_static_artwork_shadows.py
          python3 scripts/generate_cached_card_shadows.py
      - name: Verify original assets and protected contracts
        run: |
          python3 scripts/verify_assets.py
          python3 scripts/verify_performance_contract.py
          python3 scripts/verify_native_config.py
      - name: Lock dependencies
        run: flutter pub get --enforce-lockfile
      - name: Native vsync cadence math
        run: |
          kotlinc android/app/src/main/kotlin/com/baynayadayk/arabic_academy/FrameCadenceWindow.kt scripts/tests/FrameCadenceCheck.kt -include-runtime -d "$RUNNER_TEMP/bayna-cadence.jar"
          java -jar "$RUNNER_TEMP/bayna-cadence.jar"
      - name: Dart analyzer
        run: flutter analyze --no-pub
      - name: Bounded startup and back navigation regressions
        run: |
          flutter test --no-pub --concurrency=1 \
            test/widget_test.dart test/navigation_back_test.dart \
            test/dialogue_vocabulary_test.dart test/dialogue_dictionary_visibility_test.dart \
            test/progress_lazy_lessons_test.dart
      - name: Touch synchronization and scroll-only frame cadence
        run: |
          flutter test --no-pub --concurrency=1 \
            --dart-define=BAYNA_PERF_DIAGNOSTICS=true \
            --dart-define=BAYNA_TOUCH_RESAMPLING=true \
            test/scroll_timing_isolation_test.dart \
            test/scroll_frame_sample_test.dart \
            test/touch_frame_sync_test.dart
      - name: Four mode GPU shadow tests
        run: |
          flutter test --no-pub --timeout=120s --concurrency=1 \
            --dart-define=BAYNA_PERF_DIAGNOSTICS=true \
            test/shadow_mode_isolation_test.dart \
            test/card_shadow_raster_ab_test.dart \
            test/frame_diagnostics_overlay_test.dart \
            test/frame_performance_report_test.dart \
            test/fitted_artwork_decode_test.dart \
            test/course_unit_gpu_shadow_test.dart \
            test/v29_raster_layer_recovery_test.dart \
            test/matte_depth_test.dart \
            test/scroll_isolation_test.dart
      - name: Cached card texture parity widget tests
        run: |
          flutter test --no-pub --timeout=120s --concurrency=1 \
            --dart-define=BAYNA_CACHED_CARD_SHADOWS=true \
            --dart-define=BAYNA_PERF_DIAGNOSTICS=true \
            test/cached_card_shadow_test.dart \
            test/cached_shadow_layout_regression_test.dart \
            test/card_shadow_draw_work_test.dart \
            test/card_shadow_pixel_parity_test.dart \
            test/situations_lazy_scroll_test.dart
      - name: Verify prepared asset-shadow drawing bypasses GPU blur
        run: |
          flutter test --no-pub --timeout=120s --concurrency=1 \
            --dart-define=BAYNA_STATIC_SHADOW_ASSETS=true \
            test/static_artwork_shadow_test.dart
  full-regressions:
    runs-on: ubuntu-22.04
    timeout-minutes: 40
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with: {flutter-version: '3.35.7', channel: stable, cache: true}
      - name: Prepare shadow assets for all regression tests
        run: |
          python3 -m pip install --disable-pip-version-check Pillow==11.3.0
          python3 scripts/generate_static_artwork_shadows.py
          python3 scripts/generate_cached_card_shadows.py
      - name: Resolve locked Flutter packages
        run: flutter pub get --enforce-lockfile
      - name: Run all unit/widget tests including navigation, RTL and PDF
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          mapfile -t cases < <(find test -type f -name '*_test.dart' | sort | awk -v shard="$SHARD" '(NR-1)%4 == shard')
          test "${#cases[@]}" -gt 0
          flutter test --no-pub --concurrency=2 --timeout=120s "${cases[@]}"
  android-arm64:
    needs: [quality, full-regressions]
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with: {distribution: temurin, java-version: '17', cache: gradle}
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with: {flutter-version: '3.35.7', channel: stable, cache: true}
      - name: Prepare cached shadow masks for build
        run: |
          python3 -m pip install --disable-pip-version-check Pillow==11.3.0
          python3 scripts/generate_static_artwork_shadows.py
          python3 scripts/generate_cached_card_shadows.py
      - name: Prepare original Android resources and developer signature
        run: |
          bash scripts/prepare_android_ci.sh
          bash scripts/prepare_arabic_ocr.sh
          bash scripts/prepare_signing.sh --mode development
          flutter pub get --enforce-lockfile
      - name: Keep transparent app icon
        run: |
          python3 -m pip install --disable-pip-version-check Pillow==11.3.0
          python3 scripts/test_transparent_launcher_icons.py
          python3 scripts/prepare_transparent_launcher_icons.py
      - name: ARM64 release Flutter AOT/R8 build
        run: |
          flutter build apk --release --target-platform android-arm64 \
            --split-per-abi \
            --dart-define=BAYNA_STATIC_SHADOW_ASSETS=true \
            --dart-define=BAYNA_CACHED_CARD_SHADOWS=true \
            --dart-define=BAYNA_TOUCH_RESAMPLING=true
      - name: Check that pre-blurred art masks are packaged
        run: |
          unzip -l build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            | grep -F 'flutter_assets/assets/artwork/shadow_cache/lesson_generated__u1_greeting.png'
          unzip -l build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            | grep -F 'flutter_assets/assets/artwork/shadow_cache/card__regular_light.png'
          unzip -l build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            | grep -F 'flutter_assets/assets/artwork/shadow_cache/card__emphasized_dark.png'
      - name: Verify package, ABI, resources and development signature
        run: |
          python3 scripts/verify_android_artifacts.py --mode development \
            --apksigner "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            --certificate-sha256 "$(cat build/signing/certificate.sha256)" \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            | grep -F "package: name='com.example.arabic_academy'"
      - name: Upload v54 corrected card geometry APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bayna-v54-card-layout-scroll-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 14
