name: Dictionary Flutter checks without APK
on:
  push:
    branches: ["codex/bayna-dictionary-demo-apk-20261024"]
    paths:
      - "lib/**"
      - "test/**"
      - "pubspec.yaml"
      - ".github/workflows/dictionary-flutter-tests.yml"
  workflow_dispatch:
jobs:
  flutter-checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.35.7"
          cache: true
      - name: Resolve Flutter dependencies
        run: flutter pub get
      - name: Analyze Dart and Flutter sources
        run: flutter analyze
      - name: Execute Flutter unit and widget tests
        run: flutter test
