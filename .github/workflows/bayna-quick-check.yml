name: Bayna quick Flutter verification
on:
  push:
    branches: [codex/bayna-impeccable-ui-v8]
permissions:
  contents: read
concurrency:
  group: bayna-quick-${{ github.ref }}
  cancel-in-progress: true
jobs:
  flutter-checks:
    runs-on: ubuntu-22.04
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with: {flutter-version: '3.35.7', channel: stable, cache: true}
      - name: Locked dependencies and static analysis
        run: |
          flutter pub get --enforce-lockfile
          flutter analyze --no-pub
      - name: UI and gesture regression tests
        run: |
          flutter test --no-pub --reporter expanded --timeout 60s test/floating_navigation_test.dart test/navigation_back_test.dart test/private_textbook_test.dart test/pdf_zoom_test.dart test/arabic_voice_test.dart test/settings_compact_test.dart test/book1_part2_test.dart test/demo_school_test.dart test/demo_school_widgets_test.dart test/vocabulary_practice_test.dart test/practice_center_test.dart test/learning_expansion_test.dart test/startup_catalog_test.dart
