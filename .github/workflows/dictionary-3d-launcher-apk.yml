name: Bayna dictionary 3D launcher APK
on:
  push:
    branches: [codex/bayna-3d-adaptive-launcher-20261110]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - '.github/workflows/dictionary-3d-launcher-apk.yml'
      - 'tooling/**'
  workflow_dispatch:
jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.35.7"
          cache: true
      - name: Create Android platform project
        run: flutter create --project-name bayna_dictionary --platforms android --org com.xalidmuslim .
      - name: Enable Android predictive back for generated platform
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          source = manifest.read_text()
          assert '<application' in source
          source = source.replace('<application', '<application android:enableOnBackInvokedCallback="true"', 1)
          manifest.write_text(source)
          PY
      - name: Verify 3D art and icon contour resource mapping
        run: python3 -m unittest discover -s tooling/icon -p 'test_*.py'
      - name: Install 3D adaptive and legacy launcher icons
        run: python3 tooling/icon/install_android_icon.py
      - name: Install Flutter packages
        run: flutter pub get
      - name: Dictionary regression tests
        run: flutter test
      - name: Run full test suite and analyzer
        run: |
          flutter test
          flutter analyze
      - name: Render compact UI previews for QA
        run: flutter test --update-goldens --dart-define=CAPTURE_UX_GOLDENS=true test/dictionary_ux_visual_test.dart
      - uses: actions/upload-artifact@v4
        with:
          name: bayna-ux-screenshot-previews
          path: test/goldens/*.png
      - name: Install alongside previous preview (keep existing app data)
        run: |
          set -euo pipefail
          f=android/app/build.gradle.kts
          test -f "$f"
          sed -i 's/applicationId = "com.xalidmuslim.bayna_dictionary"/applicationId = "com.xalidmuslim.bayna_dictionary.arabiconly.icon3d"/' "$f"
          grep -F 'applicationId = "com.xalidmuslim.bayna_dictionary.arabiconly.icon3d"' "$f"
      - name: Build Android ARM64 APK
        run: flutter build apk --release --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: bayna-dictionary-3d-icon-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Verify APK and built-in original icon
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          sha256sum build/app/outputs/flutter-apk/app-release.apk
          file build/app/outputs/flutter-apk/app-release.apk
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          from zipfile import ZipFile
          apk = Path('build/app/outputs/flutter-apk/app-release.apk')
          expected = 'bdf4ffdda02e6f8028b226a1bbfc3ca6901cb9a9e8c32f6327ce46c9aae2832f'
          with ZipFile(apk) as z:
              assets = [n for n in z.namelist() if n.endswith('.webp')]
              matching = [n for n in assets if hashlib.sha256(z.read(n)).hexdigest() == expected]
              print('Packaged WebP resources:', assets)
              assert len(matching) == 1, f'Original 3D art missing or duplicated: {matching}'
          print('Verified original 3D art is inside the APK:', matching[0])
          PY

