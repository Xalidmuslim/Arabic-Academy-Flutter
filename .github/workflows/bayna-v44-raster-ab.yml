name: Bayna v44 Raster Shadow A-B
on:
  push:
    branches: [codex/bayna-v44-raster-shadow-ab-20261023]
permissions:
  contents: read
concurrency:
  group: bayna-v44-raster-shadow
  cancel-in-progress: true
jobs:
  focused-quality:
    runs-on: ubuntu-22.04
    timeout-minutes: 35
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with: {flutter-version: '3.35.7', channel: stable, cache: true}
      - name: Validate performance contracts and asset integrity
        run: |
          python3 scripts/verify_performance_contract.py
          python3 scripts/verify_assets.py
          python3 scripts/verify_native_config.py
      - name: Resolve frozen dependencies
        run: |
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock
      - name: Check Dart syntax and types
        run: flutter analyze --no-pub
      - name: Run GPU A-B and preservation regression tests
        run: |
          flutter test --no-pub --concurrency=2 --timeout=120s \
            test/card_shadow_raster_ab_test.dart \
            test/matte_depth_test.dart \
            test/course_unit_gpu_shadow_test.dart \
            test/frame_diagnostics_overlay_test.dart \
            test/frame_performance_report_test.dart \
            test/situations_lazy_scroll_test.dart \
            test/unit_catalog_progress_test.dart \
            test/scroll_isolation_test.dart \
            test/progress_immutable_catalog_cache_test.dart \
            test/navigation_back_test.dart
      - name: Verify diagnostic flag actually affects live cards
        run: |
          flutter test --no-pub --timeout=120s \
            --dart-define=BAYNA_PERF_DIAGNOSTICS=true \
            test/card_shadow_raster_ab_test.dart \
            test/frame_diagnostics_overlay_test.dart \
            test/course_unit_gpu_shadow_test.dart
  full-regressions:
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with: {flutter-version: '3.35.7', channel: stable, cache: true}
      - run: flutter pub get --enforce-lockfile
      - name: Run all Flutter unit/widget tests
        env:
          SHARD: ${{ matrix.shard }}
        run: |
          mapfile -t test_files < <(find test -type f -name '*_test.dart' | sort | awk -v shard="$SHARD" '(NR-1)%4 == shard')
          test "${#test_files[@]}" -gt 0
          flutter test --no-pub --concurrency=2 --timeout=120s "${test_files[@]}"
  android-diagnostic:
    needs: focused-quality
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    env:
      GRADLE_OPTS: -Dorg.gradle.project.kotlin.compiler.execution.strategy=in-process
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with: {distribution: temurin, java-version: '17', cache: gradle}
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with: {flutter-version: '3.35.7', channel: stable, cache: true}
      - name: Prepare private Android resources and development signature
        run: |
          bash scripts/prepare_android_ci.sh
          bash scripts/prepare_arabic_ocr.sh
          bash scripts/prepare_signing.sh --mode development
          flutter pub get --enforce-lockfile
      - name: Use separate Android package to preserve v43 data
        run: |
          python3 - <<'PY'
          from pathlib import Path
          gradle=Path('android/app/build.gradle.kts')
          src=gradle.read_text()
          token='applicationId = "com.example.arabic_academy"'
          assert src.count(token)==1
          gradle.write_text(src.replace(token,'applicationId = "com.example.arabic_academy.perf44"'))
          manifest=Path('android/app/src/main/AndroidManifest.xml')
          src=manifest.read_text()
          token='android:label="Байна Ядайк"'
          assert src.count(token)==1
          manifest.write_text(src.replace(token,'android:label="Байна Ядайк GPU 44"'))
          PY
      - name: Prepare transparent launcher icon
        run: |
          python3 -m pip install --disable-pip-version-check Pillow==11.3.0
          python3 scripts/test_transparent_launcher_icons.py
          python3 scripts/prepare_transparent_launcher_icons.py
      - name: Build ARM64 release with frame diagnostics
        run: |
          flutter build apk --release --target-platform android-arm64 \
            --split-per-abi --dart-define=BAYNA_PERF_DIAGNOSTICS=true
      - name: Verify R8 APK signature, ABI and independent identity
        run: |
          python3 scripts/verify_android_artifacts.py --mode development \
            --apksigner "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            --certificate-sha256 "$(cat build/signing/certificate.sha256)" \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            | grep -F "package: name='com.example.arabic_academy.perf44'"
      - name: Upload v44 GPU shadow comparison APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bayna-v44-gpu-ab-arm64-development
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 14
