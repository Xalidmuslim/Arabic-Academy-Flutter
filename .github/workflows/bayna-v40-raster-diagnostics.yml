name: Bayna v40 raster diagnostics and image decode
on:
  push:
    branches: [codex/bayna-v40-raster-diagnostics-2026-10-23]
permissions:
  contents: read
concurrency:
  group: bayna-v40-raster
  cancel-in-progress: true
jobs:
  flutter-quality:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with: {flutter-version: '3.35.7', channel: stable, cache: true}
      - name: Protected performance contract and asset checks
        run: |
          python3 scripts/verify_performance_contract.py
          python3 scripts/verify_assets.py
          python3 scripts/verify_native_config.py
      - name: Locked dependencies
        run: |
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock
      - name: Flutter analyzer
        run: flutter analyze --no-pub
      - name: Frame and scroll regression tests
        run: |
          flutter test --no-pub --concurrency=2 --timeout=120s \
            test/fitted_artwork_decode_test.dart \
            test/frame_performance_report_test.dart \
            test/frame_diagnostics_overlay_test.dart \
            test/scroll_isolation_test.dart \
            test/background_artwork_preloader_test.dart \
            test/unit_catalog_progress_test.dart \
            test/app_shell_performance_test.dart \
            test/lesson_scroll_virtualization_test.dart \
            test/neumorphic_dashboard_test.dart \
            test/matte_depth_test.dart \
            test/pdf_page_cache_test.dart \
            test/pdf_zoom_test.dart \
            test/navigation_back_test.dart
  diagnostic-arm64-apk:
    needs: [flutter-quality]
    runs-on: ubuntu-22.04
    timeout-minutes: 55
    env:
      GRADLE_OPTS: -Dorg.gradle.project.kotlin.compiler.execution.strategy=in-process
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with: {distribution: temurin, java-version: '17', cache: gradle}
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with: {flutter-version: '3.35.7', channel: stable, cache: true}
      - name: Prepare Android, OCR, signing and locked dependencies
        run: |
          bash scripts/prepare_android_ci.sh
          bash scripts/prepare_arabic_ocr.sh
          bash scripts/prepare_signing.sh --mode development
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock
      - name: Prepare frameless icon
        run: |
          python3 -m pip install --disable-pip-version-check Pillow==11.3.0
          python3 scripts/test_transparent_launcher_icons.py
          python3 scripts/prepare_transparent_launcher_icons.py
      - name: Compile release ARM64 with on-screen frame diagnostics
        run: |
          flutter build apk --release \
            --target-platform android-arm64 --split-per-abi \
            --dart-define=BAYNA_PERF_DIAGNOSTICS=true
      - name: Verify ABI, contents, signature
        run: |
          python3 scripts/verify_android_artifacts.py --mode development \
            --apksigner "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            --certificate-sha256 "$(cat build/signing/certificate.sha256)" \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
      - name: Publish v40 diagnostic APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bayna-v40-raster-diagnostics-arm64-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 14
