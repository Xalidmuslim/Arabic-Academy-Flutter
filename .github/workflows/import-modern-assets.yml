name: Import generated premium artwork
on:
  push:
    branches: [codex/modern-premium-v0-3]
    paths:
      - scripts/import_modern_assets.py
      - .github/workflows/import-modern-assets.yml
permissions:
  contents: write
jobs:
  import-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: true
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - run: python scripts/import_modern_assets.py
      - name: Commit optimized artwork
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images
          if ! git diff --cached --quiet; then
            git commit -m "assets: add original modern premium WebP graphics"
            git push origin HEAD:codex/modern-premium-v0-3
          fi
