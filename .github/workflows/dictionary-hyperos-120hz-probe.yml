name: Bayna dictionary HyperOS 120Hz isolated probe APK
on:
  push:
    branches: [experiment/bayna-dictionary-hyperos-120hz-20261110]
    paths:
      - 'lib/**'
      - 'test/**'
      - 'pubspec.yaml'
      - '.github/workflows/dictionary-hyperos-120hz-probe.yml'
      - 'tooling/**'
  workflow_dispatch:
jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.35.7"
          cache: true
      - name: Create Android platform project
        run: flutter create --project-name bayna_dictionary --platforms android --org com.xalidmuslim .
      - name: Unit tests for Flutter surface refresh policy installer
        run: python3 -m unittest discover -s tooling/android -p 'test_hyperos_120hz_probe.py'
      - name: Install frame-rate preference on Flutter render views
        run: |
          python3 tooling/android/install_hyperos_120hz_probe.py
          grep -F 'view.requestedFrameRate = 120f' android/app/src/main/kotlin/com/xalidmuslim/bayna_dictionary/MainActivity.kt
          grep -F 'onFlutterSurfaceViewCreated' android/app/src/main/kotlin/com/xalidmuslim/bayna_dictionary/MainActivity.kt
          grep -F 'onFlutterTextureViewCreated' android/app/src/main/kotlin/com/xalidmuslim/bayna_dictionary/MainActivity.kt
      - name: Clearly label the isolated HyperOS test installation
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          source = manifest.read_text()
          assert 'android:label="bayna_dictionary"' in source
          manifest.write_text(source.replace('android:label="bayna_dictionary"',
              'android:label="Словарь Байна Ядайк · Тест 120 Гц"', 1))
          PY
      - name: Enable Android predictive back for generated platform
        run: |
          python3 - <<'PY'
          from pathlib import Path
          manifest = Path('android/app/src/main/AndroidManifest.xml')
          source = manifest.read_text()
          assert '<application' in source
          source = source.replace('<application', '<application android:enableOnBackInvokedCallback="true"', 1)
          manifest.write_text(source)
          PY
      - name: Verify 3D art and icon contour resource mapping
        run: python3 -m unittest discover -s tooling/icon -p 'test_*.py'
      - name: Install 3D adaptive and legacy launcher icons
        run: python3 tooling/icon/install_android_icon.py
      - name: Install Flutter packages
        run: flutter pub get
      - name: Run full Flutter test suite and analyzer
        run: |
          flutter test
          flutter analyze
      - name: Verify Flutter View rate vote with no conflicting window policy
        run: |
          ! grep -q 'flutter_displaymode:' pubspec.yaml
          ! grep -q 'FlutterDisplayMode' lib/ui/dictionary_shell.dart
          ! grep -q 'preferredDisplayModeId' android/app/src/main/kotlin/com/xalidmuslim/bayna_dictionary/MainActivity.kt
          ! grep -q 'preferredRefreshRate' android/app/src/main/kotlin/com/xalidmuslim/bayna_dictionary/MainActivity.kt
          grep -F 'view.requestedFrameRate = 120f' android/app/src/main/kotlin/com/xalidmuslim/bayna_dictionary/MainActivity.kt
      - name: Check runtime contains no custom animations or diagnostic overlay
        run: |
          python3 - <<'PY'
          from pathlib import Path
          content = Path('lib/ui/dictionary_shell.dart').read_text()
          review = Path('lib/ui/review_screen.dart').read_text()
          for token in ['AnimatedSwitcher(', 'ExpansionTile(', 'frameDiagnosticsOverlay',
                        'showFrameDiagnostics', 'renderMode', 'StartupFrameDiagnostics',
                        'dictionary_animations_enabled_v1', 'trackDictionaryScroll(']:
              assert token not in content, f'Runtime still contains {token}'
          assert 'AnimatedSwitcher(' not in review
          assert 'LinearProgressIndicator(' not in review
          assert 'themeAnimationDuration: Duration.zero' in content
          assert 'animationDuration: Duration.zero' in content
          print('Static UI and no debug overlay verified')
          PY
      - name: Render compact UI previews for QA
        run: flutter test --update-goldens --dart-define=CAPTURE_UX_GOLDENS=true test/dictionary_ux_visual_test.dart
      - uses: actions/upload-artifact@v4
        with:
          name: bayna-ux-screenshot-previews
          path: test/goldens/*.png
      - name: Isolate package ID for a safe side-by-side HyperOS test
        run: |
          set -euo pipefail
          f=android/app/build.gradle.kts
          test -f "$f"
          sed -i 's/applicationId = "com.xalidmuslim.bayna_dictionary"/applicationId = "com.xalidmuslim.bayna_dictionary.arabiconly.hzprobe"/' "$f"
          grep -F 'applicationId = "com.xalidmuslim.bayna_dictionary.arabiconly.hzprobe"' "$f"
      - name: Build Android ARM64 APK
        run: flutter build apk --release --target-platform android-arm64
      - uses: actions/upload-artifact@v4
        with:
          name: bayna-dictionary-hyperos-120hz-probe-apk
          path: build/app/outputs/flutter-apk/app-release.apk
      - name: Verify APK and built-in original icon
        run: |
          test -s build/app/outputs/flutter-apk/app-release.apk
          AAPT="$(find "$ANDROID_HOME/build-tools" -mindepth 2 -maxdepth 2 -name aapt -type f | sort -V | tail -1)"
          test -n "$AAPT"
          "$AAPT" dump badging build/app/outputs/flutter-apk/app-release.apk | grep "package: name='com.xalidmuslim.bayna_dictionary.arabiconly.hzprobe'"
          sha256sum build/app/outputs/flutter-apk/app-release.apk
          file build/app/outputs/flutter-apk/app-release.apk
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          from zipfile import ZipFile
          apk = Path('build/app/outputs/flutter-apk/app-release.apk')
          expected = 'bdf4ffdda02e6f8028b226a1bbfc3ca6901cb9a9e8c32f6327ce46c9aae2832f'
          with ZipFile(apk) as z:
              assets = [n for n in z.namelist() if n.endswith('.webp')]
              matching = [n for n in assets if hashlib.sha256(z.read(n)).hexdigest() == expected]
              print('Packaged WebP resources:', assets)
              assert len(matching) == 1, f'Original 3D art missing or duplicated: {matching}'
          print('Verified original 3D art is inside the APK:', matching[0])
          PY

