name: Import reference feature artwork
on:
  push:
    branches: [codex/reference-ui-v0-4]
    paths:
      - scripts/import_reference_art.py
      - .github/workflows/import-reference-art.yml
permissions:
  contents: write
jobs:
  reference-assets:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - run: python -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Import optimized feature artwork
        run: python scripts/import_reference_art.py
      - name: Commit reference feature images
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add assets/images/feature_*.webp
          if ! git diff --cached --quiet; then
            git commit -m "assets: add four large reference feature images and photographic covers"
            git push origin HEAD:codex/reference-ui-v0-4
          fi
