name: Bayna platform verification and development builds
on:
  push:
    branches: [codex/bayna-platform]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      release_builds:
        description: Build verified Android release APK splits and AAB
        type: boolean
        default: false
permissions:
  contents: read
concurrency:
  group: bayna-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
env:
  FLUTTER_VERSION: '3.35.7'
  DENO_VERSION: '2.9.6'
  CI: 'true'
  COCOAPODS_DISABLE_STATS: 'true'
  GRADLE_OPTS: -Dorg.gradle.project.kotlin.compiler.execution.strategy=in-process
jobs:
  quality:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with: {persist-credentials: false}
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5.6.0
        with: {python-version: '3.12'}
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e # v2.21.0
        with: {flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true}
      - name: Asset integrity and standard-library Python tests
        run: |
          python3 scripts/verify_assets.py
          python3 -m unittest discover -s scripts/tests -v
      - name: Native configurations and committed dependency lock
        run: |
          python3 scripts/verify_native_config.py
          git ls-files --error-unmatch pubspec.lock
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock
      - name: Analyze all Flutter code
        run: flutter analyze --no-pub
      - name: Run the complete Flutter suite with packaged assets
        run: flutter test --no-pub --reporter expanded
  backend:
    runs-on: ubuntu-22.04
    timeout-minutes: 20
    env:
      POSTGRES_IMAGE: postgres:16-alpine@sha256:721873c34ceb9f8d8fc265984940dc982404c105f19ad51be9fdc5970a6080ea
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: denoland/setup-deno@e95548e56dfa95d4e1a28d6f422fafe75c4c26fb # v2.0.3
        with: {deno-version: '${{ env.DENO_VERSION }}'}
      - name: Real PostgreSQL migration and RLS tests in disposable Docker
        run: bash scripts/test_backend.sh
      - name: Licensed catalog SQL compatibility and permissions with synthetic fixture
        run: python3 scripts/test_catalog_sql.py
      - name: Deno Edge checks and adapter tests with unchanged lockfile
        run: |
          git ls-files --error-unmatch supabase/functions/deno.lock
          deno check --frozen --config supabase/functions/deno.json supabase/functions/*/index.ts
          deno test --frozen --config supabase/functions/deno.json --allow-env --allow-read supabase/functions/_shared/backend_test.ts
          git diff --exit-code -- supabase/functions/deno.lock
  android-debug:
    needs: [quality, backend]
    runs-on: ubuntu-22.04
    timeout-minutes: 45
    env: {BAYNA_SIGNING_MODE: development}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00 # v4.7.1, full JDK
        with: {distribution: temurin, java-version: '17', cache: gradle}
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with: {flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true}
      - name: Android 36 prerequisites and development signing
        run: |
          javac -version
          bash scripts/prepare_android_ci.sh
          bash scripts/prepare_signing.sh --mode development
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock
      - run: flutter build apk --debug --no-pub
      - name: Verify debug package and actual development certificate
        run: >-
          python3 scripts/verify_android_artifacts.py
          --apksigner "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          --certificate-sha256 "$(cat build/signing/certificate.sha256)"
          build/app/outputs/flutter-apk/app-debug.apk
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: android-debug-development-key
          path: build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 7
  ios:
    needs: [quality, backend]
    runs-on: macos-15
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: maxim-lobanov/setup-xcode@60606e260d2fc5762a71e64e74b2174e8ea3c8bd # v1.6.0
        with: {xcode-version: '16.4'}
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with: {flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true}
      - name: iOS 15 native and dependency compatibility
        run: |
          python3 scripts/verify_native_config.py
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock
          flutter build ios --release --no-codesign --config-only --no-pub
          cd ios
          if [[ -f Podfile.lock ]]; then pod install --deployment; else pod install; fi
      - name: Build unsigned iOS application
        run: |
          set +e
          flutter build ios --release --no-codesign --no-pub > /tmp/bayna-ios-build.log 2>&1
          result=$?
          set -e
          cat /tmp/bayna-ios-build.log
          if [[ "$result" != 0 ]]; then
            python3 - <<'PY'
          from pathlib import Path
          text = '\n'.join(Path('/tmp/bayna-ios-build.log').read_text().splitlines()[-100:])[-16000:]
          text = text.replace('%', '%25').replace('\r', '%0D').replace('\n', '%0A')
          print('::error title=Unsigned iOS build diagnostic::' + text)
          PY
          fi
          exit "$result"
      - name: Preserve unsigned app bundle and label it clearly
        run: |
          test -d build/ios/iphoneos/Runner.app
          ditto -c -k --sequesterRsrc --keepParent build/ios/iphoneos/Runner.app build/ios/unsigned-Runner.app.zip
          printf 'Unsigned iOS build only. No Apple signing, provisioning or installable signed IPA was produced.\n' >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: ios-15-unsigned-Runner-app
          path: |
            build/ios/unsigned-Runner.app.zip
            ios/Podfile.lock
          if-no-files-found: error
          retention-days: 7
  android-release:
    if: github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.release_builds)
    needs: [quality, backend, android-debug]
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with: {distribution: temurin, java-version: '17', cache: gradle}
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with: {flutter-version: '${{ env.FLUTTER_VERSION }}', channel: stable, cache: true}
      - name: Prepare selected signing identity
        id: signing
        run: |
          mode=development
          if [[ -n "$ANDROID_KEYSTORE_BASE64" ]]; then mode=owner; fi
          bash scripts/prepare_signing.sh --mode "$mode"
          printf 'BAYNA_SIGNING_MODE=%s\n' "$mode" >> "$GITHUB_ENV"
          if [[ "$mode" == owner ]]; then printf 'BAYNA_REQUIRE_RELEASE_SIGNING=true\n' >> "$GITHUB_ENV"; fi
          printf 'mode=%s\n' "$mode" >> "$GITHUB_OUTPUT"
      - name: Locked dependencies and exact Android prerequisites
        run: |
          bash scripts/prepare_android_ci.sh
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock
      - name: Release ABI APKs and AAB
        run: |
          flutter build apk --release --split-per-abi
          flutter build appbundle --release --no-pub
          git diff --exit-code -- pubspec.lock
      - name: Verify archive integrity, ABIs, assets, signatures and selected certificate
        run: >-
          python3 scripts/verify_android_artifacts.py --split-apks
          --mode "$BAYNA_SIGNING_MODE"
          --apksigner "$ANDROID_HOME/build-tools/36.0.0/apksigner"
          --certificate-sha256 "$(cat build/signing/certificate.sha256)"
          build/app/outputs/flutter-apk/app-*-release.apk
          build/app/outputs/bundle/release/app-release.aab
      - name: Label release artifacts
        run: printf 'Android release signing mode=%s. Development mode uses the public debug identity and is not a production store release.\n' "$BAYNA_SIGNING_MODE" >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: android-${{ steps.signing.outputs.mode }}-release-apks-and-aab
          path: |
            build/app/outputs/flutter-apk/app-*-release.apk
            build/app/outputs/bundle/release/app-release.aab
            build/signing/certificate.sha256
          if-no-files-found: error
          retention-days: 7
