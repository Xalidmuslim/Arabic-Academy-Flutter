name: Flutter Android debug APK
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - name: Generate Flutter platform folders
        run: flutter create --project-name arabic_academy --platforms android,ios .
      - name: Install tooling for generated launcher icons
        run: python3 -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Generate modern app icons
        run: python3 scripts/refresh_launcher_icons.py
      - name: Install dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze
      - name: Test
        run: flutter test
      - name: Build Android APK
        run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: arabic-academy-android-debug
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
