name: Bayna dictionary web preview

on:
  push:
    branches:
      - codex/bayna-web-pwa-20261110
  workflow_dispatch:

permissions:
  contents: read

jobs:
  web-build:
    runs-on: ubuntu-latest
    timeout-minutes: 50
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.35.7"
          cache: true
      - name: Complete the Flutter Android and web platform scaffolds
        run: flutter create --project-name bayna_dictionary --platforms android,web --org com.xalidmuslim .
      - name: Install dependencies
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze
      - name: Run all existing and web-asset tests
        run: flutter test
      - name: Build website for GitHub Pages subpath
        run: flutter build web --release --base-href /Arabic-Academy-Flutter/
      - name: Verify HTML, manifest, and every corpus chunk in the web bundle
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          from pathlib import Path
          root = Path('build/web')
          assert (root / 'index.html').is_file()
          assert (root / 'flutter_bootstrap.js').is_file()
          assert (root / 'main.dart.js').is_file()
          assert (root / 'manifest.json').is_file()
          assert (root / 'icons/bayna.svg').is_file()
          assert '/Arabic-Academy-Flutter/' in (root / 'index.html').read_text()
          manifest = json.loads(Path('assets/data/corpus_manifest.json').read_text())
          files = manifest['files']
          missing = [name for name in ['assets/data/corpus_manifest.json', *files]
                     if not (root / 'assets' / name).is_file()]
          assert not missing, f'Missing corpus assets: {missing}'
          print(f'Web build includes all {len(files)} dictionary corpus files')
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: bayna-dictionary-web-preview
          path: build/web/
          if-no-files-found: error
          retention-days: 14
      - name: Prepare the GitHub Pages deployment artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: build/web/
      - name: Build Android ARM64 APK from the exact same source and corpus
        run: flutter build apk --release --target-platform android-arm64
      - name: Verify APK exists and is not empty
        run: test -s build/app/outputs/flutter-apk/app-release.apk
      - uses: actions/upload-artifact@v4
        with:
          name: bayna-dictionary-android-preview
          path: build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
          retention-days: 14

  deploy-pages:
    name: Publish dictionary on GitHub Pages
    needs: web-build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy compiled website
        id: deployment
        uses: actions/deploy-pages@v4
