name: Bayna v46 Recover v29 Raster Hierarchy
on:
  push:
    branches: [codex/bayna-v46-v29-render-layer-recovery-20261023]
permissions:
  contents: read
concurrency:
  group: bayna-v46-raster-recovery-ci
  cancel-in-progress: true
jobs:
  quality:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with: {flutter-version: '3.35.7', channel: stable, cache: true}
      - name: Verify original assets and protected contracts
        run: |
          python3 scripts/verify_assets.py
          python3 scripts/verify_performance_contract.py
          python3 scripts/verify_native_config.py
      - name: Lock dependencies
        run: flutter pub get --enforce-lockfile
      - name: Dart analyzer
        run: flutter analyze --no-pub
      - name: Four mode GPU shadow tests
        run: |
          flutter test --no-pub --timeout=120s --concurrency=1 \
            --dart-define=BAYNA_PERF_DIAGNOSTICS=true \
            test/shadow_mode_isolation_test.dart \
            test/card_shadow_raster_ab_test.dart \
            test/frame_diagnostics_overlay_test.dart \
            test/frame_performance_report_test.dart \
            test/fitted_artwork_decode_test.dart \
            test/course_unit_gpu_shadow_test.dart \
            test/v29_raster_layer_recovery_test.dart \
            test/matte_depth_test.dart
  android-arm64:
    needs: quality
    runs-on: ubuntu-22.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with: {distribution: temurin, java-version: '17', cache: gradle}
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with: {flutter-version: '3.35.7', channel: stable, cache: true}
      - name: Prepare original Android resources and developer signature
        run: |
          bash scripts/prepare_android_ci.sh
          bash scripts/prepare_arabic_ocr.sh
          bash scripts/prepare_signing.sh --mode development
          flutter pub get --enforce-lockfile
      - name: Install as separate package from production and v44
        run: |
          python3 - <<'PY'
          from pathlib import Path
          gradle=Path('android/app/build.gradle.kts')
          s=gradle.read_text()
          original='applicationId = "com.example.arabic_academy"'
          assert s.count(original)==1
          gradle.write_text(s.replace(original,'applicationId = "com.example.arabic_academy.perf46"'))
          manifest=Path('android/app/src/main/AndroidManifest.xml')
          s=manifest.read_text()
          original='android:label="Байна Ядайк"'
          assert s.count(original)==1
          manifest.write_text(s.replace(original,'android:label="Байна Ядайк GPU 46"'))
          PY
      - name: Keep transparent app icon
        run: |
          python3 -m pip install --disable-pip-version-check Pillow==11.3.0
          python3 scripts/test_transparent_launcher_icons.py
          python3 scripts/prepare_transparent_launcher_icons.py
      - name: ARM64 release Flutter AOT/R8 build
        run: |
          flutter build apk --release --target-platform android-arm64 \
            --split-per-abi --dart-define=BAYNA_PERF_DIAGNOSTICS=true
      - name: Verify package, ABI, resources and development signature
        run: |
          python3 scripts/verify_android_artifacts.py --mode development \
            --apksigner "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            --certificate-sha256 "$(cat build/signing/certificate.sha256)" \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          "$ANDROID_HOME/build-tools/36.0.0/aapt" dump badging \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk \
            | grep -F "package: name='com.example.arabic_academy.perf46'"
      - name: Upload v46 Android APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bayna-v46-shadow-isolation-arm64
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 14
