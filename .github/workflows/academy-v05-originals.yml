name: Arabic Academy v0.5 original artwork APK
on:
  push:
    branches: [codex/original-art-v0-5]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true
      - run: flutter create --project-name arabic_academy --platforms android,ios .
      - run: python3 -m pip install --disable-pip-version-check pillow==11.3.0
      - name: Restore original generated photos and icons
        run: python3 scripts/restore_original_artwork.py
      - run: python3 scripts/refresh_launcher_icons.py
      - run: flutter pub get
      - run: flutter analyze
      - run: flutter test
      - run: flutter build apk --debug
      - uses: actions/upload-artifact@v4
        with:
          name: Arabic-Academy-v0.5-originals
          path: build/app/outputs/flutter-apk/app-debug.apk
          retention-days: 7
