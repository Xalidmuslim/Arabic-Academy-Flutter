name: Bayna v34 intensive practice APK
on:
  push:
    branches: [codex/bayna-v32-home-sage-redesign]
permissions:
  contents: read
concurrency:
  group: bayna-v32-home
  cancel-in-progress: true
jobs:
  build-apk:
    runs-on: ubuntu-22.04
    timeout-minutes: 50
    env:
      GRADLE_OPTS: -Dorg.gradle.project.kotlin.compiler.execution.strategy=in-process
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with: {persist-credentials: false}
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with: {distribution: temurin, java-version: '17', cache: gradle}
      - uses: subosito/flutter-action@fd55f4c5af5b953cc57a2be44cb082c8f6635e8e
        with: {flutter-version: '3.35.7', channel: stable, cache: true}
      - name: Prepare signing, OCR and locked dependencies
        run: |
          bash scripts/prepare_android_ci.sh
          bash scripts/prepare_arabic_ocr.sh
          bash scripts/prepare_signing.sh --mode development
          flutter pub get --enforce-lockfile
          git diff --exit-code -- pubspec.lock
          python3 scripts/verify_assets.py
      - name: Focused UI tests
        run: |
          flutter analyze --no-pub
          flutter test --no-pub test/neumorphic_dashboard_test.dart test/matte_depth_test.dart test/dialogue_vocabulary_test.dart test/vocabulary_practice_test.dart test/intensive_vocabulary_test.dart test/intensive_workout_screen_test.dart

      - name: Compile ARM64 release APK
        run: flutter build apk --release --target-platform android-arm64 --split-per-abi
      - name: Verify APK certificate and contents
        run: |
          python3 scripts/verify_android_artifacts.py --mode development \
            --apksigner "$ANDROID_HOME/build-tools/36.0.0/apksigner" \
            --certificate-sha256 "$(cat build/signing/certificate.sha256)" \
            build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
      - name: Upload Android APK
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: bayna-v34-intensive-home-arm64-apk
          path: build/app/outputs/flutter-apk/app-arm64-v8a-release.apk
          if-no-files-found: error
          retention-days: 14
