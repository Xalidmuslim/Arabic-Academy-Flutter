name: Dictionary APK build
on:
  push:
    branches: ["codex/bayna-dictionary-demo-apk-20261024"]
    paths: ["lib/**", "assets/**", "pubspec.yaml", "test/**", ".github/workflows/dictionary-apk.yml"]
  workflow_dispatch:
jobs:
  build-apk:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: "3.35.7"
          cache: true
      - name: Generate Android project
        run: flutter create --project-name bayna_dictionary --platforms android --org com.xalidmuslim .
      - name: Install packages
        run: flutter pub get
      - name: Static analysis
        run: flutter analyze
      - name: Unit tests
        run: flutter test
      - name: Build release ARM64 APK
        run: flutter build apk --release --target-platform android-arm64
      - name: Publish APK as direct branch download
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/bayna-dictionary-demo.apk
          test -s dist/bayna-dictionary-demo.apk
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add dist/bayna-dictionary-demo.apk
          git commit -m "build: dictionary APK [skip ci]"
          git push
      - uses: actions/upload-artifact@v4
        with:
          name: bayna-dictionary-demo-apk
          path: build/app/outputs/flutter-apk/app-release.apk
